<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Detail Mahasiswa</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Detail Mahasiswa</h1>

        <table class="detail">
            <tr><th>NIM</th><td>{{ m.nim }}</td></tr>
            <tr><th>Nama</th><td>{{ m.nama }}</td></tr>
            <tr><th>Program Studi</th><td>{{ m.program_studi }}</td></tr>
            <tr><th>Angkatan</th><td>{{ m.angkatan }}</td></tr>
            <tr><th>IPK</th><td>{{ "%.2f"|format(m.ipk) }}</td></tr>
            <tr><th>Lama Studi</th><td>{{ m.lama_studi }} tahun</td></tr>
        </table>

        <div class="tombol">
            <a href="/mahasiswa/{{ m.nim }}/edit" class="btn btn-warning">Edit</a>
            <a href="/mahasiswa" class="btn">Kembali</a>
        </div>
    </div>
</body>
</html>
